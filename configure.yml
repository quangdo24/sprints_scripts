---
# configure.yml — prepare linux2 to run healthmon.py
#
# Installs OS packages, Python dependencies, and creates log directories.
# Idempotent: safe to run repeatedly; second run should report changed=0.

- name: Configure linux2 for healthmon
  hosts: linux2
  become: true
  vars:
    project_root: /home/ubuntu/projects/sprints_scripts
    evidence_dir: "{{ project_root }}/evidence"
    deploy_user: ubuntu

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-psutil
          - cron
        state: present

    - name: Ensure cron service is enabled and running
      ansible.builtin.service:
        name: cron
        state: started
        enabled: true

    - name: Install Python dependencies for healthmon
      ansible.builtin.apt:
        name: python3-psutil
        state: present

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ project_root }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Create evidence directory for log files
      ansible.builtin.file:
        path: "{{ evidence_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"
